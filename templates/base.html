<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SentinelLens{% endblock %}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <!-- Animate.css -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <style>
    /* ─── CSS Variables ──────────────────────────────────────────────────────── */
    :root {
      --bg:            #0a0e1a;
      --bg-secondary:  #0d1224;
      --surface:       rgba(15, 20, 40, 0.8);
      --surface-solid: #0f1428;
      --surface-hover: rgba(20, 28, 55, 0.9);
      --border:        rgba(99, 120, 200, 0.18);
      --border-bright: rgba(99, 120, 200, 0.35);
      --text:          #e2e8f8;
      --text-dim:      #8892b0;
      --text-muted:    #4a5568;

      --accent:   #4f8ef7;
      --accent-2: #7c3aed;

      --high:        #f87171;
      --high-glow:   rgba(248, 113, 113, 0.35);
      --high-bg:     rgba(248, 113, 113, 0.08);
      --high-border: rgba(248, 113, 113, 0.3);

      --medium:        #fbbf24;
      --medium-glow:   rgba(251, 191, 36, 0.35);
      --medium-bg:     rgba(251, 191, 36, 0.08);
      --medium-border: rgba(251, 191, 36, 0.3);

      --low:        #34d399;
      --low-glow:   rgba(52, 211, 153, 0.35);
      --low-bg:     rgba(52, 211, 153, 0.08);
      --low-border: rgba(52, 211, 153, 0.3);

      --info:        #60a5fa;
      --info-glow:   rgba(96, 165, 250, 0.35);
      --info-bg:     rgba(96, 165, 250, 0.08);
      --info-border: rgba(96, 165, 250, 0.3);

      --radius:   10px;
      --radius-lg: 16px;
      --transition: 0.2s ease;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.6);
    }

    /* ─── Reset & Base ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    a { color: var(--accent); text-decoration: none; transition: color var(--transition); }
    a:hover { color: #79b4ff; }

    /* ─── Animated Background ────────────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,120,200,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,120,200,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: -40%;
      left: -20%;
      width: 80%;
      height: 80%;
      background: radial-gradient(ellipse, rgba(79,142,247,0.06) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
      animation: bgPulse 12s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      0%   { transform: translate(0,0) scale(1); opacity: 0.6; }
      100% { transform: translate(15%,10%) scale(1.2); opacity: 1; }
    }

    /* ─── Navbar ─────────────────────────────────────────────────────────────── */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 14, 26, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 58px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 17px;
      color: var(--text);
      letter-spacing: -0.3px;
      text-decoration: none;
      flex-shrink: 0;
    }

    .navbar-brand:hover { color: var(--text); text-decoration: none; }

    /* Shield/Eye icon */
    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #4f8ef7 0%, #7c3aed 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 16px rgba(79,142,247,0.5);
      flex-shrink: 0;
    }

    .navbar-nav {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
    }

    .navbar-nav a {
      position: relative;
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      transition: all var(--transition);
      text-decoration: none;
    }

    .navbar-nav a:hover {
      color: var(--text);
      background: rgba(99,120,200,0.1);
      text-decoration: none;
    }

    .navbar-nav a.active {
      color: var(--accent);
      background: rgba(79,142,247,0.1);
    }

    .navbar-nav a.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* Status dot in navbar */
    .nav-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: rgba(15,20,40,0.5);
    }

    .nav-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--low);
      box-shadow: 0 0 6px var(--low-glow);
      animation: statusPulse 2s ease infinite;
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ─── Layout ─────────────────────────────────────────────────────────────── */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 28px;
    }

    .page-header { margin-bottom: 28px; }
    .page-header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .page-header p {
      color: var(--text-dim);
      margin-top: 4px;
      font-size: 13px;
    }

    /* ─── Glassmorphism Cards ─────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .card:hover {
      border-color: var(--border-bright);
    }

    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.02);
    }

    .card-header-icon {
      margin-right: 8px;
      font-size: 15px;
    }

    .card-body { padding: 18px; }

    /* ─── Stat Cards ──────────────────────────────────────────────────────────── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      position: relative;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      overflow: hidden;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      cursor: default;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    .stat-card-total::before  { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .stat-card-high::before   { background: linear-gradient(90deg, var(--high), #ef4444); }
    .stat-card-medium::before { background: linear-gradient(90deg, var(--medium), #f59e0b); }
    .stat-card-low::before    { background: linear-gradient(90deg, var(--low), #10b981); }

    .stat-card-total  { border-color: var(--info-border); box-shadow: 0 0 20px rgba(79,142,247,0.06); }
    .stat-card-high   { border-color: var(--high-border); box-shadow: 0 0 20px var(--high-glow); }
    .stat-card-medium { border-color: var(--medium-border); }
    .stat-card-low    { border-color: var(--low-border); }

    .stat-card-high { animation: highPulse 3s ease-in-out infinite; }

    @keyframes highPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(248,113,113,0.15); }
      50%       { box-shadow: 0 0 32px rgba(248,113,113,0.35); }
    }

    .stat-icon {
      font-size: 20px;
      margin-bottom: 10px;
      display: block;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }

    .stat-card-total  .stat-value { color: var(--accent); }
    .stat-card-high   .stat-value { color: var(--high); }
    .stat-card-medium .stat-value { color: var(--medium); }
    .stat-card-low    .stat-value { color: var(--low); }

    /* ─── Badges ─────────────────────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }

    .badge-high {
      background: var(--high-bg);
      color: var(--high);
      border: 1px solid var(--high-border);
      box-shadow: 0 0 8px rgba(248,113,113,0.2);
    }

    .badge-medium {
      background: var(--medium-bg);
      color: var(--medium);
      border: 1px solid var(--medium-border);
    }

    .badge-low {
      background: var(--low-bg);
      color: var(--low);
      border: 1px solid var(--low-border);
    }

    .badge-info {
      background: var(--info-bg);
      color: var(--info);
      border: 1px solid var(--info-border);
    }

    .badge-muted {
      background: rgba(99,120,200,0.08);
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .truncated-badge {
      background: rgba(251,191,36,0.12);
      color: var(--medium);
      border: 1px solid rgba(251,191,36,0.3);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-left: 6px;
    }

    /* ─── Buttons ────────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(15,20,40,0.6);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      transition: all var(--transition);
      white-space: nowrap;
      text-decoration: none;
    }

    .btn:hover {
      background: rgba(99,120,200,0.15);
      border-color: var(--border-bright);
      color: var(--text);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #4f8ef7 0%, #7c3aed 100%);
      color: #fff;
      border: none;
      box-shadow: 0 0 20px rgba(79,142,247,0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #5a9bff 0%, #8b4ff5 100%);
      color: #fff;
      box-shadow: 0 0 28px rgba(79,142,247,0.55);
    }

    .btn-danger {
      background: rgba(248,113,113,0.1);
      color: var(--high);
      border-color: var(--high-border);
    }

    .btn-danger:hover {
      background: rgba(248,113,113,0.2);
    }

    /* ─── Alerts ─────────────────────────────────────────────────────────────── */
    .alert {
      padding: 13px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
    }

    .alert-offline {
      background: rgba(251,191,36,0.07);
      border: 1px solid rgba(251,191,36,0.25);
      color: var(--medium);
    }

    .alert-success {
      background: rgba(52,211,153,0.07);
      border: 1px solid rgba(52,211,153,0.25);
      color: var(--low);
    }

    /* ─── Tables ─────────────────────────────────────────────────────────────── */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }

    table { width: 100%; border-collapse: collapse; }

    thead tr { background: rgba(255,255,255,0.02); }

    th {
      padding: 11px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(99,120,200,0.08);
      vertical-align: middle;
      transition: background var(--transition);
    }

    tr:last-child td { border-bottom: none; }

    tbody tr {
      transition: background var(--transition), box-shadow var(--transition);
    }

    tbody tr:hover td {
      background: rgba(79,142,247,0.04);
    }

    /* ─── Score Bar ───────────────────────────────────────────────────────────── */
    .score-bar {
      position: relative;
      height: 5px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      width: 80px;
      overflow: hidden;
    }

    .score-bar-fill {
      position: absolute;
      top: 0; left: 0;
      height: 100%;
      border-radius: 3px;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ─── Timeline ───────────────────────────────────────────────────────────── */
    .timeline { position: relative; padding-left: 22px; }

    .timeline::before {
      content: '';
      position: absolute;
      left: 7px; top: 6px; bottom: 6px;
      width: 2px;
      background: linear-gradient(180deg, var(--accent) 0%, transparent 100%);
      opacity: 0.3;
    }

    .timeline-item {
      position: relative;
      margin-bottom: 14px;
    }

    .timeline-dot {
      position: absolute;
      left: -18px; top: 8px;
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      box-shadow: 0 0 8px currentColor;
    }

    .timeline-content {
      background: rgba(255,255,255,0.025);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 14px;
      transition: border-color var(--transition);
    }

    .timeline-content:hover { border-color: var(--border-bright); }

    .timeline-time { font-size: 11px; color: var(--text-muted); }

    /* ─── Chat ───────────────────────────────────────────────────────────────── */
    .chat-panel { display: flex; flex-direction: column; gap: 12px; }

    .chat-messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 60px;
      max-height: 400px;
      overflow-y: auto;
      padding: 4px 0;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .chat-bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      animation: bubbleIn 0.2s ease;
    }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }

    .chat-bubble-user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(79,142,247,0.2), rgba(124,58,237,0.2));
      border: 1px solid rgba(79,142,247,0.25);
      color: var(--text);
    }

    .chat-bubble-agent {
      align-self: flex-start;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .chat-bubble .label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .chat-spl {
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      background: rgba(0,0,0,0.4);
      padding: 10px 12px;
      border-radius: 6px;
      margin-top: 8px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--info);
      border: 1px solid rgba(96,165,250,0.15);
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 9px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      transition: border-color var(--transition), box-shadow var(--transition);
      outline: none;
    }

    .chat-input:focus {
      border-color: rgba(79,142,247,0.5);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
    }

    .chat-input::placeholder { color: var(--text-muted); }

    /* Typing dots */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-indicator span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typingDot 1.2s ease infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingDot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30%            { transform: translateY(-4px); opacity: 1; }
    }

    /* ─── Pipeline Running Animation ─────────────────────────────────────────── */
    @keyframes pipelinePulse {
      0%, 100% { box-shadow: 0 0 20px rgba(79,142,247,0.35); }
      50%       { box-shadow: 0 0 40px rgba(79,142,247,0.7); }
    }

    .btn-running {
      animation: pipelinePulse 1.2s ease infinite;
    }

    /* ─── Loading Spinner ─────────────────────────────────────────────────────── */
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }

    .spinner-sm {
      width: 12px; height: 12px;
      border-width: 1.5px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Filter Bar ─────────────────────────────────────────────────────────── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .filter-group { display: flex; gap: 4px; }

    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filter-btn:hover { border-color: var(--border-bright); color: var(--text); }
    .filter-btn.active-all    { background: rgba(79,142,247,0.15); color: var(--accent); border-color: rgba(79,142,247,0.4); }
    .filter-btn.active-HIGH   { background: var(--high-bg); color: var(--high); border-color: var(--high-border); }
    .filter-btn.active-MEDIUM { background: var(--medium-bg); color: var(--medium); border-color: var(--medium-border); }
    .filter-btn.active-LOW    { background: var(--low-bg); color: var(--low); border-color: var(--low-border); }

    .search-input {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 12px 6px 32px;
      color: var(--text);
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      width: 200px;
    }

    .search-input:focus {
      border-color: rgba(79,142,247,0.5);
      box-shadow: 0 0 0 3px rgba(79,142,247,0.1);
    }

    .search-wrapper { position: relative; }

    .search-wrapper::before {
      content: '⌕';
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }

    /* ─── Pagination ─────────────────────────────────────────────────────────── */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-top: 1px solid var(--border);
    }

    .pagination-info { font-size: 12px; color: var(--text-muted); }

    .pagination-controls { display: flex; gap: 4px; align-items: center; }

    .page-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all var(--transition);
    }

    .page-btn:hover { background: rgba(99,120,200,0.1); border-color: var(--border-bright); color: var(--text); }
    .page-btn.active { background: rgba(79,142,247,0.2); border-color: rgba(79,142,247,0.4); color: var(--accent); }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ─── Slider ─────────────────────────────────────────────────────────────── */
    .score-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 120px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }

    .score-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px rgba(79,142,247,0.5);
    }

    /* ─── Utilities ──────────────────────────────────────────────────────────── */
    .text-muted { color: var(--text-muted); }
    .text-dim   { color: var(--text-dim); }
    .mono       { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; }
    .truncate   { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .animate-in {
      animation: fadeInUp 0.4s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    /* Stagger children */
    .stagger > *:nth-child(1)  { animation-delay: 0.04s; }
    .stagger > *:nth-child(2)  { animation-delay: 0.08s; }
    .stagger > *:nth-child(3)  { animation-delay: 0.12s; }
    .stagger > *:nth-child(4)  { animation-delay: 0.16s; }
    .stagger > *:nth-child(5)  { animation-delay: 0.20s; }
    .stagger > *:nth-child(6)  { animation-delay: 0.24s; }
    .stagger > *:nth-child(7)  { animation-delay: 0.28s; }
    .stagger > *:nth-child(8)  { animation-delay: 0.32s; }
    .stagger > *:nth-child(9)  { animation-delay: 0.36s; }
    .stagger > *:nth-child(10) { animation-delay: 0.40s; }
    .stagger > *:nth-child(n+11) { animation-delay: 0.44s; }

    /* ─── Custom scrollbar ───────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99,120,200,0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99,120,200,0.35); }

    /* ─── Responsive ─────────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .navbar { padding: 0 16px; }
      .container { padding: 16px; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .stat-grid { grid-template-columns: 1fr; }
      .filter-bar { gap: 8px; }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/dashboard" class="navbar-brand">
      <div class="brand-icon">🔍</div>
      SentinelLens
    </a>

    <div class="navbar-nav">
      <a href="/dashboard" id="nav-incidents">Incidents</a>
      <a href="/api/v1/health" target="_blank">Health</a>
      <a href="/api/v1/model/report" target="_blank">Model</a>
    </div>

    <div class="nav-status" style="margin-left:12px;">
      <div class="nav-status-dot"></div>
      <span>SOC Live</span>
    </div>
  </nav>

  <!-- Page content -->
  <div class="container animate-in">
    {% block content %}{% endblock %}
  </div>

  <script>
    // Mark active nav link
    (function() {
      const path = window.location.pathname;
      document.querySelectorAll('.navbar-nav a').forEach(a => {
        if (a.getAttribute('href') === path) a.classList.add('active');
      });
      if (path === '/dashboard' || path.startsWith('/incidents')) {
        document.getElementById('nav-incidents').classList.add('active');
      }
    })();

    // Animated counter utility
    function animateCounter(el, target, duration = 900, decimals = 0) {
      const start = performance.now();
      const from = 0;
      function update(now) {
        const t = Math.min((now - start) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        const val = from + (target - from) * ease;
        el.textContent = decimals > 0 ? val.toFixed(decimals) : Math.round(val);
        if (t < 1) requestAnimationFrame(update);
        else el.textContent = decimals > 0 ? target.toFixed(decimals) : target;
      }
      requestAnimationFrame(update);
    }

    // Expose globally
    window.animateCounter = animateCounter;
  </script>

</body>
</html>
